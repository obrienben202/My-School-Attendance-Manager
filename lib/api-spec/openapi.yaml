        - personCode
        - fromDate
        - toDate
        - reason
        - partDay
        - status
        - submittedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        studentId:
          type: integer
        learnerName:
          type: string
        personCode:
          type: string
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        reason:
          type: string
        partDay:
          type: boolean
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending]
        submittedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlannedAbsenceInput:
      type: object
      required: [studentId, fromDate, toDate, reason]
      properties:
        studentId:
          type: integer
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
        partDay:
          type: boolean
          default: false
        startTime:
          type: string
        endTime:
          type: string
        notes:
