        scheduleId:
          type: integer
        date:
          type: string
          format: date
        status:
          type: string
          enum: [draft, submitted]
        updatedAt:
          type: string
          format: date-time
        submittedAt:
          type: ["string", "null"]
          format: date-time
        marks:
