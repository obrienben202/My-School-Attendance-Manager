openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: High School Attendance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: students
    description: Student operations
  - name: courses
    description: Course operations
  - name: attendance
    description: Attendance register operations
  - name: targets
    description: SMART target operations
  - name: ilps
    description: Individual Learning Plans
  - name: schedule
    description: Schedule operations
  - name: dashboard
    description: Dashboard summary operations
  - name: assessments
    description: Assessment and marking operations
  - name: concierge
    description: Concierge applicant and application operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: eprogressions
    description: eProgression submission and pending queue
  - name: staff
    description: Staff records and staff-scoped read-only views
  - name: planned-absences
    description: Authenticated planned absence requests
  - name: safeguarding
    description: Protected safeguarding notes for authorised staff

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /reports/{reportId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Run a current report for authorised report users
      description: Returns persisted report data only. Report definitions whose requested fields are not persisted return 422 instead of sample data.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
        - name: academicYear
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: course
          in: query
          schema: { type: string }
        - name: surname
          in: query
          schema: { type: string }
        - name: threshold
          in: query
          schema: { type: string }
        - name: tutor
          in: query
          schema: { type: string }
        - name: unit
          in: query
          schema: { type: string }
        - name: overdueTo
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current report result, including the applied filters and freshness timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          description: Invalid report filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Reports access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: This report is unavailable because its fields are not persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students with optional search filters
      parameters:
        - name: personCode
          in: query
          schema:
            type: string
        - name: forename
          in: query
          schema:
            type: string
        - name: surname
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - name: yearGroup
          in: query
          schema:
            type: string
        - name: atRisk
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /planned-absences:
    get:
      operationId: listPlannedAbsences
      tags: [planned-absences]
      summary: List the authenticated user's planned absence requests
      responses:
        "200":
          description: Planned absence requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannedAbsence"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    post:
      operationId: createPlannedAbsence
      tags: [planned-absences]
      summary: Create a planned absence request for a learner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedAbsenceInput"
      responses:
        "201":
          description: Planned absence request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedAbsence"
        "400":
          description: Invalid request or date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /safeguarding/notes:
    get:
      operationId: listSafeguardingNotes
      tags: [safeguarding]
      summary: List protected safeguarding notes
      description: Lists safeguarding notes for authorised safeguarding staff only.
      responses:
        "200":
          description: Protected safeguarding notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSafeguardingNotesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Safeguarding access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createSafeguardingNote
      tags: [safeguarding]
      summary: Create a protected safeguarding note
      description: Creates a note attributed to the authenticated authorised staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardingNoteInput"
      responses:
        "201":
          description: Safeguarding note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingNote"
        "400":
          description: Invalid note or learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Safeguarding access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/at-risk:
    get:
      operationId: listAtRiskStudents
      tags: [students]
      summary: List students flagged as at risk
      responses:
        "200":
          description: At risk students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Not found

  /attendance:
    get:
      operationId: listAttendanceRecords
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: courseId
          in: query
          schema:
            type: integer
        - name: scheduleId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [present, absent, late, authorised, excluded, distance_learning]
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
    post:
      operationId: createAttendanceRecord
      tags: [attendance]
      summary: Mark attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid attendance data, including a date whose weekday does not match the selected schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register:
    post:
      operationId: submitAttendanceRegister
      tags: [attendance]
      summary: Save a draft or submit all marks for a lesson register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "200":
          description: Authoritative saved register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "400":
          description: Invalid register data, including a date whose weekday does not match the selected schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/audit:
    get:
      operationId: listAttendanceRegisterAudit
      tags: [attendance]
      summary: List persisted audit events for one register occurrence
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Register audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRegisterAudit"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/contacts:
    get:
      operationId: listAttendanceRegisterContacts
      tags: [attendance]
      summary: List contact addresses for learners on an authorised register
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Learner contact addresses for the register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRegisterContact"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/state:
    get:
      operationId: getAttendanceRegisterState
      tags: [attendance]
      summary: Get lifecycle state for one exact register occurrence
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Exact occurrence lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegisterOccurrenceState"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/reopen:
    post:
      operationId: reopenAttendanceRegister
      tags: [attendance]
      summary: Explicitly reopen a submitted register as an editable draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterOccurrenceInput"
      responses:
        "200":
          description: Reopened register state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegisterLifecycle"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Register is not currently submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/{id}:
    patch:
      operationId: updateAttendanceRecord
      tags: [attendance]
      summary: Update an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
    delete:
      operationId: deleteAttendanceRecord
      tags: [attendance]
      summary: Delete an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List SMART targets
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: overdue
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      tags: [targets]
      summary: Create a SMART target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"

  /targets/{id}:
    patch:
      operationId: updateTarget
      tags: [targets]
      summary: Update a SMART target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
    delete:
      operationId: deleteTarget
      tags: [targets]
      summary: Delete a target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ilps:
    get:
      operationId: listIlps
      tags: [ilps]
      summary: List Individual Learning Plans
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: ILPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ilp"
    post:
      operationId: createIlp
      tags: [ilps]
      summary: Create an ILP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IlpInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ilp"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments with optional filters
      parameters:
        - name: courseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Assessments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Create an assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get assessment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
    patch:
      operationId: updateAssessment
      tags: [assessments]
      summary: Update an assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
    delete:
      operationId: deleteAssessment
      tags: [assessments]
      summary: Delete an assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assessment-results:
    get:
      operationId: listAssessmentResults
      tags: [assessments]
      summary: List assessment results
      parameters:
        - name: assessmentId
          in: query
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Results list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResult"
    post:
      operationId: createAssessmentResult
      tags: [assessments]
      summary: Create or upsert an assessment result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentResultInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /assessment-results/{id}:
    patch:
      operationId: updateAssessmentResult
      tags: [assessments]
      summary: Update an assessment result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentResultInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /eprogressions:
    get:
      operationId: listEprogressions
      tags: [eprogressions]
      summary: List eProgressions
      parameters:
        - name: studentId
          in: query
          required: false
          schema:
            type: integer
        - name: courseId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of eProgressions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Eprogression"
    post:
      operationId: createEprogression
      tags: [eprogressions]
      summary: Submit eProgression(s)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EprogressionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eprogression"

  /eprogressions/{id}:
    patch:
      operationId: updateEprogression
      tags: [eprogressions]
      summary: Update eProgression status (authorise/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EprogressionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Eprogression"
    delete:
      operationId: deleteEprogression
      tags: [eprogressions]
      summary: Delete an eProgression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /concierge/applications:
    get:
      operationId: listConciergeApplications
      tags: [concierge]
      summary: List all concierge applications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConciergeApplication"
    post:
      operationId: createConciergeApplication
      tags: [concierge]
      summary: Create a new concierge application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeApplicationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeApplication"

  /concierge/applications/{id}:
    get:
      operationId: getConciergeApplication
      tags: [concierge]
      summary: Get a single concierge application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeApplication"
    patch:
      operationId: updateConciergeApplication
      tags: [concierge]
      summary: Update a concierge application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeApplicationInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeApplication"
    delete:
      operationId: deleteConciergeApplication
      tags: [concierge]
      summary: Delete a concierge application
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /concierge/enrolments:
    get:
      operationId: listConciergeEnrolments
      tags: [concierge]
      summary: List learner enrolments
      responses:
        "200":
          description: Learner enrolments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConciergeEnrolment"
    post:
      operationId: createConciergeEnrolment
      tags: [concierge]
      summary: Complete a learner enrolment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeEnrolmentInput"
      responses:
        "201":
          description: Completed learner enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeEnrolment"
        "400":
          description: Invalid enrolment details
        "401":
          description: Authentication required
        "403":
          description: Concierge access required
        "404":
          description: Application, learner, or course not found

  /concierge/enrolments/{id}:
    get:
      operationId: getConciergeEnrolment
      tags: [concierge]
      summary: Get a learner enrolment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Learner enrolment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeEnrolment"
        "404":
          description: Enrolment not found

  /concierge/enrolments/{id}/photo:
    post:
      operationId: associateConciergeEnrolmentPhoto
      tags: [concierge]
      summary: Associate an uploaded learner photo with an enrolment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConciergeEnrolmentPhotoInput"
      responses:
        "200":
          description: Enrolment with saved photo reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConciergeEnrolment"
        "400":
          description: Invalid photo reference
        "401":
          description: Authentication required
        "404":
          description: Enrolment or uploaded object not found

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: Returns a presigned URL for a direct image upload. The client sends metadata here, then uploads the file directly to storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields
        "401":
          description: Authentication required
        "500":
          description: Failed to generate upload URL

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    post:
      tags: [Auth]
      operationId: loginWithPassword
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '401':
          description: Invalid credentials
        '403':
          description: Credentials were valid, but the account has not been synchronized from the school directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Clear the session and log out
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /admin/sync-users:
    post:
      tags: [Auth]
      operationId: syncUsersFromSheet
      summary: Reconcile users and roles from the school directory
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectorySyncResult'
        '422':
          description: Directory validation failed; no user changes were applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDirectorySyncResult'
        '403':
          description: Admin access required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: The school directory could not be fetched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

  /schedule/today:
    get:
      operationId: getTodaySchedule
      tags: [schedule]
      summary: Get today's schedule/registers
      responses:
        "200":
          description: Today's schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleEntry"

  /staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List staff records
      responses:
        "200":
          description: Staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffSource"

  /staff/{id}:
    get:
      operationId: getStaff
      tags: [staff]
      summary: Get a staff record and assigned courses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRecord"
        "404":
          description: Staff member not found

  /staff/{id}/timetable:
    get:
      operationId: getStaffTimetable
      tags: [staff]
      summary: Get a staff member's timetable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff timetable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTimetableResponse"
        "401":
          description: Authentication required
        "404":
          description: Staff member not found

  /staff/{id}/register-history:
    get:
      operationId: getStaffRegisterHistory
      tags: [staff]
      summary: Get register history scoped to a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Staff register history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffRegisterHistoryResponse"
        "401":
          description: Authentication required
        "404":
          description: Staff member not found

  /staff/{id}/room-bookings:
    get:
      operationId: getStaffRoomBookings
      tags: [staff]
      summary: Get room bookings for a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room bookings or explicit unavailable-source state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUnavailableRecordsResponse"
        "401":
          description: Authentication required
        "404":
          description: Staff member not found

  /staff/{id}/correspondence:
    get:
      operationId: getStaffCorrespondence
      tags: [staff]
      summary: Get correspondence for a staff member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Correspondence or explicit unavailable-source state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUnavailableRecordsResponse"
        "401":
          description: Authentication required
        "404":
          description: Staff member not found

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    ReportId:
      type: string
      enum:
        - att-overall
        - att-learner
        - att-course
        - att-punctuality
        - asmt-grade-summary
        - asmt-results
        - asmt-unconfirmed
        - ilp-progress
        - ilp-reviews-due
        - ilp-completion
        - sg-at-risk
        - sg-planned-absence
        - mb-verification-status
        - mb-grades-released
    ReportColumn:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
    ReportResponse:
      type: object
      required: [reportId, title, description, columns, rows, appliedFilters, rowCount, generatedAt, asOf]
      properties:
        reportId:
          $ref: "#/components/schemas/ReportId"
        title: { type: string }
        description: { type: string }
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ReportColumn"
        rows:
          type: array
          items:
            type: array
            items:
              type: string
        appliedFilters:
          type: object
          additionalProperties: { type: string }
        rowCount: { type: integer }
        generatedAt: { type: string, format: date-time }
        asOf: { type: [string, "null"], format: date-time }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, hod, staff, office]
        username:
          type: [string, 'null']
        department:
          type: [string, 'null']
    UserSyncSummary:
      type: object
      required: [inserted, updated, unchanged, skipped, retired, invalid, duplicates, unmatched, errors]
      properties:
        inserted: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        skipped: { type: integer }
        retired: { type: integer }
        invalid: { type: integer }
        duplicates: { type: integer }
        unmatched: { type: integer }
        errors:
          type: array
          items: { type: string }
    UserDirectorySyncResult:
      type: object
      required: [synced, summary]
      properties:
        synced: { type: integer }
        summary:
          $ref: '#/components/schemas/UserSyncSummary'
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    SafeguardingNote:
      type: object
      required: [id, studentId, learnerName, personCode, author, content, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        learnerName: { type: string }
        personCode: { type: string }
        author: { type: string }
        content: { type: string }
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ListSafeguardingNotesResponse:
      type: array
      items:
        $ref: "#/components/schemas/SafeguardingNote"
    SafeguardingNoteInput:
      type: object
      required: [studentId, content]
      properties:
        studentId: { type: integer }
        content:
          type: string
          minLength: 1
          maxLength: 10000
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      properties:
        attendancePercent:
          type: number
        punctualityPercent:
          type: number
        registersCount:
          type: integer
        atRiskCount:
          type: integer
        smartTargetsCount:
          type: integer
        ilpsCount:
          type: integer
      required:
        - attendancePercent
        - punctualityPercent
        - registersCount
        - atRiskCount
        - smartTargetsCount
        - ilpsCount

    Student:
      type: object
      properties:
        id:
          type: integer
        personCode:
          type: string
        forename:
          type: string
        surname:
          type: string
        middleNames:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
          format: date
        postCode:
          type: ["string", "null"]
        yearGroup:
          type: ["string", "null"]
        attendancePercent:
          type: number
        punctualityPercent:
          type: number
        atRisk:
          type: boolean
        confirmedLearner:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - personCode
        - forename
        - surname
        - attendancePercent
        - punctualityPercent
        - atRisk
        - confirmedLearner
        - createdAt

    StudentInput:
      type: object
      properties:
        personCode:
          type: string
        forename:
          type: string
        surname:
          type: string
        middleNames:
          type: string
        title:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
        postCode:
          type: string
        yearGroup:
          type: string
        atRisk:
          type: boolean
        confirmedLearner:
          type: boolean
      required:
        - personCode
        - forename
        - surname

    StudentUpdate:
      type: object
      properties:
        forename:
          type: string
        surname:
          type: string
        middleNames:
          type: string
        title:
          type: string
        gender:
          type: string
        dateOfBirth:
          type: string
          format: date
        postCode:
          type: string
        yearGroup:
          type: string
        atRisk:
          type: boolean
        confirmedLearner:
          type: boolean

    Course:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        room:
          type: ["string", "null"]
        staffName:
          type: ["string", "null"]
        headOfDepartment:
          type: ["string", "null"]
        yearGroup:
          type: ["string", "null"]
        enrolledCount:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - code
        - name
        - enrolledCount
        - isActive
        - createdAt

    AttendanceRecord:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        courseId:
          type: integer
        scheduleId:
          type: ["integer", "null"]
        date:
          type: string
          format: date
        status:
          type: string
          enum: [present, absent, late, authorised, excluded, distance_learning]
        minutesLate:
          type: ["integer", "null"]
          minimum: 0
          maximum: 60
        notes:
          type: ["string", "null"]
        studentName:
          type: ["string", "null"]
        courseName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studentId
        - courseId
        - scheduleId
        - date
        - status
        - createdAt

    AttendanceInput:
      type: object
      properties:
        studentId:
          type: integer
        courseId:
          type: integer
        scheduleId:
          type: integer
        date:
          type: string
          format: date
        status:
          type: string
          enum: [present, absent, late, authorised, excluded, distance_learning]
        minutesLate:
          type: integer
          minimum: 0
          maximum: 60
        notes:
          type: string
      required:
        - studentId
        - courseId
        - scheduleId
        - date
        - status

    AttendanceUpdate:
      type: object
      properties:
