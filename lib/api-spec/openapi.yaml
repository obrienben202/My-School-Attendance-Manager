      responses:
        "204": { description: Deleted }
        "400": { description: Invalid group identifier }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "404": { description: Group not found }
        "409": { description: Year 7–11 default groups cannot be deleted }
components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    IlpGroupFilter:
      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field: { type: string, enum: ["Year Group"] }
        operator: { type: string, enum: ["equals", "is not"] }
        value: { type: string, pattern: '^(Year )?(7|8|9|10|11)$' }
    IlpGroupInput:
      type: object
      additionalProperties: false
      required: [name, filters]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        filters:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/IlpGroupFilter" }
    IlpGroup:
      type: object
      required: [id, name, filters, learnerCount, defaultYear, createdBy, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        filters:
          type: array
          items: { $ref: "#/components/schemas/IlpGroupFilter" }
        learnerCount: { type: integer, minimum: 0 }
        defaultYear: { type: ["integer", "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    TermlyIlpTemplateContent:
      type: object
      required: [title, welcome, instructions, endGuidance, targetExamples, sections]
      properties:
