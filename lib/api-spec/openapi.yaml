openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: High School Attendance Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: health
    description: Health operations
  - name: students
    description: Student operations
  - name: courses
    description: Course operations
  - name: attendance
    description: Attendance register operations
  - name: targets
    description: SMART target operations
  - name: ilps
    description: Individual Learning Plans
  - name: schedule
    description: Schedule operations
  - name: dashboard
    description: Dashboard summary operations
  - name: assessments
    description: Assessment and marking operations
  - name: concierge
    description: Concierge applicant and application operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: eprogressions
    description: eProgression submission and pending queue
  - name: staff
    description: Staff records and staff-scoped read-only views
  - name: planned-absences
    description: Authenticated planned absence requests
  - name: safeguarding
    description: Protected safeguarding notes for authorised staff

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /reports/{reportId}:
    get:
      operationId: getReport
      tags: [reports]
      summary: Run a current report for authorised report users
      description: Returns persisted report data only, including the source-data freshness timestamp when records match.
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ReportId"
        - name: academicYear
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: course
          in: query
          schema: { type: string }
        - name: surname
          in: query
          schema: { type: string }
        - name: threshold
          in: query
          schema: { type: string }
        - name: tutor
          in: query
          schema: { type: string }
        - name: unit
          in: query
          schema: { type: string }
        - name: overdueTo
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { type: string }
        - name: completion
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current report result, including the applied filters and freshness timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "400":
          description: Invalid report filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Reports access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students with optional search filters
      parameters:
        - name: personCode
          in: query
          schema:
            type: string
        - name: forename
          in: query
          schema:
            type: string
        - name: surname
          in: query
          schema:
            type: string
        - name: gender
          in: query
          schema:
            type: string
        - name: yearGroup
          in: query
          schema:
            type: string
        - name: atRisk
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /planned-absences:
    get:
      operationId: listPlannedAbsences
      tags: [planned-absences]
      summary: List the authenticated user's planned absence requests
      responses:
        "200":
          description: Planned absence requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannedAbsence"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

    post:
      operationId: createPlannedAbsence
      tags: [planned-absences]
      summary: Create a planned absence request for a learner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannedAbsenceInput"
      responses:
        "201":
          description: Planned absence request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannedAbsence"
        "400":
          description: Invalid request or date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /safeguarding/notes:
    get:
      operationId: listSafeguardingNotes
      tags: [safeguarding]
      summary: List protected safeguarding notes
      description: Lists protected safeguarding notes for authenticated admins, heads of department, and staff.
      responses:
        "200":
          description: Protected safeguarding notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSafeguardingNotesResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Safeguarding access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createSafeguardingNote
      tags: [safeguarding]
      summary: Create a protected safeguarding note
      description: Creates a note attributed to the authenticated admin, head of department, or staff member.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafeguardingNoteInput"
      responses:
        "201":
          description: Safeguarding note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafeguardingNote"
        "400":
          description: Invalid note or learner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Safeguarding access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /students/at-risk:
    get:
      operationId: listAtRiskStudents
      tags: [students]
      summary: List students flagged as at risk
      responses:
        "200":
          description: At risk students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List all courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{id}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          description: Not found

  /attendance:
    get:
      operationId: listAttendanceRecords
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: courseId
          in: query
          schema:
            type: integer
        - name: scheduleId
          in: query
          schema:
            type: integer
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [present, absent, late, authorised, excluded, distance_learning]
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Attendance access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    post:
      operationId: createAttendanceRecord
      tags: [attendance]
      summary: Mark attendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid attendance data, including a date whose weekday does not match the selected schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lesson register access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register:
    post:
      operationId: submitAttendanceRegister
      tags: [attendance]
      summary: Save a draft or submit all marks for a lesson register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterInput"
      responses:
        "200":
          description: Authoritative saved register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegister"
        "400":
          description: Invalid register data, including a date whose weekday does not match the selected schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lesson register access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Submitted register is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/roster:
    get:
      operationId: listAttendanceRegisterRoster
      tags: [attendance]
      summary: List learners enrolled on an authorised lesson register
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Enrolled learners for the authorised lesson occurrence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRegisterRosterStudent"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lesson register access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/audit:
    get:
      operationId: listAttendanceRegisterAudit
      tags: [attendance]
      summary: List persisted audit events for one register occurrence
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Register audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRegisterAudit"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/contacts:
    get:
      operationId: listAttendanceRegisterContacts
      tags: [attendance]
      summary: List contact addresses for learners on an authorised register
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Learner contact addresses for the register
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceRegisterContact"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/state:
    get:
      operationId: getAttendanceRegisterState
      tags: [attendance]
      summary: Get lifecycle state for one exact register occurrence
      parameters:
        - name: scheduleId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Exact occurrence lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegisterOccurrenceState"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/register/reopen:
    post:
      operationId: reopenAttendanceRegister
      tags: [attendance]
      summary: Explicitly reopen a submitted register as an editable draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceRegisterOccurrenceInput"
      responses:
        "200":
          description: Reopened register state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRegisterLifecycle"
        "400":
          description: Invalid register occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Not assigned to this register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Schedule session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Register is not currently submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /attendance/{id}:
    patch:
      operationId: updateAttendanceRecord
      tags: [attendance]
      summary: Update an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceRecord"
        "400":
          description: Invalid update or attempt to move attendance between lesson sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lesson register access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Attendance record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Submitted register is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      operationId: deleteAttendanceRecord
      tags: [attendance]
      summary: Delete an attendance record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid attendance record identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Lesson register access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Attendance record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Submitted register is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /targets:
    get:
      operationId: listTargets
      tags: [targets]
      summary: List SMART targets
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: overdue
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Targets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      tags: [targets]
      summary: Create a SMART target
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"

  /targets/{id}:
    patch:
      operationId: updateTarget
      tags: [targets]
      summary: Update a SMART target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
    delete:
      operationId: deleteTarget
      tags: [targets]
      summary: Delete a target
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /ilps:
    get:
      operationId: listIlps
      tags: [ilps]
      summary: List Individual Learning Plans
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: ILPs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ilp"
    post:
      operationId: createIlp
      tags: [ilps]
      summary: Create an ILP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IlpInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ilp"

  /ilps/{id}:
    patch:
      operationId: updateIlp
      tags: [ilps]
      summary: Update an ILP and its review or section state
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IlpUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ilp"
    delete:
      operationId: deleteIlp
      tags: [ilps]
      summary: Delete an Individual Learning Plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments with optional filters
      parameters:
        - name: courseId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Assessments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Create an assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Created
          content:
