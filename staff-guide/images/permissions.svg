<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" font-family="system-ui,Segoe UI,sans-serif" role="img"><title>Permissions by role - illustrated example</title><rect width="960" height="602" fill="#f4f7f6"/><rect width="960" height="470" fill="#f4f7f6"/><text x="480" y="46" font-size="15" font-weight="700" fill="#1d2a44" text-anchor="middle">Overview diagram — not a live screen</text><rect x="60" y="64" width="810" height="250" rx="6" fill="#fff" stroke="#d7dfe6"/><rect x="60" y="64" width="810" height="30" rx="6" fill="#e8f0ee"/><text x="70" y="84" font-size="11" font-weight="700" fill="#32776f">Feature</text><text x="370" y="84" font-size="11" font-weight="700" fill="#32776f">Admin / HR</text><text x="510" y="84" font-size="11" font-weight="700" fill="#32776f">Head of Dept</text><text x="660" y="84" font-size="11" font-weight="700" fill="#32776f">Staff</text><text x="770" y="84" font-size="11" font-weight="700" fill="#32776f">Office</text><line x1="60" x2="870" y1="94" y2="94" stroke="#d7dfe6"/><text x="70" y="120" font-size="12" font-weight="400" fill="#1d2a44">Department Timetable</text><text x="370" y="120" font-size="12" font-weight="400" fill="#1d2a44">Yes</text><text x="510" y="120" font-size="12" font-weight="400" fill="#1d2a44">Yes</text><text x="660" y="120" font-size="12" font-weight="400" fill="#1d2a44">-</text><text x="770" y="120" font-size="12" font-weight="400" fill="#1d2a44">-</text><line x1="60" x2="870" y1="138" y2="138" stroke="#d7dfe6"/><text x="70" y="164" font-size="12" font-weight="400" fill="#1d2a44">Edit Course Timetable Slots</text><text x="370" y="164" font-size="12" font-weight="400" fill="#1d2a44">Yes</text><text x="510" y="164" font-size="12" font-weight="400" fill="#1d2a44">Yes</text><text x="660" y="164" font-size="12" font-weight="400" fill="#1d2a44">-</text><text x="770" y="164" font-size="12" font-weight="400" fill="#1d2a44">-</text><line x1="60" x2="870" y1="182" y2="182" stroke="#d7dfe6"/><text x="70" y="208" font-