<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" font-family="system-ui,Segoe UI,sans-serif" role="img"><title>Forgotten password or wrong username - illustrated example</title><rect width="960" height="602" fill="#f4f7f6"/><rect width="960" height="470" fill="#0f172a"/><rect x="300" y="70" width="360" height="330" rx="16" fill="#1e293b" stroke="#334155"/><rect x="450" y="92" width="60" height="60" rx="12" fill="#3b82f6" stroke="#3b82f6"/><text x="480" y="130" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">AT</text><text x="480" y="178" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">School Portal</text><text x="480" y="198" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="middle">Sign in with your school username</text><text x="330" y="228" font-size="10" font-weight="700" fill="#94a3b8">USERNAME</text><rect x="330" y="236" width="300" height="34" rx="8" fill="#334155" stroke="#475569"/><text x="342" y="258" font-size="12" font-weight="400" fill="#64748b">e.g. maths</text><text x="330" y="292" font-size="10" font-weight="700" fill="#94a3b8">PASSWORD</text><rect x="330" y="300" width="300" height="34" rx="8" fill="#334155" stroke="#475569"/><text x="342" y="322" font-size="12" font-weight="400" fill="#64748b">Your password</text><rect x="330" y="348" width="300" height="36" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="480" y="371" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Sign in</text><rect x="680" y="236" width="250" height="90" rx="6" fill="#fff7f2" stroke="#c2410c" stroke-dasharray="4"/><text x="692" y="260" font-size="11" font-weight="700" fill="#c2410c">Not part of the screen:</text><text x="692" y="280" font-size="12" font-weight="400" fill="#1d2a44">Contact your line manager</text><text x="692" y="298" font-size="12" font-weight="400" fill="#1d2a44">or Admin Team</text><rect x="0" y="470" width="960" height="132" fill="#fff" stroke="#d7dfe6"/><text x="20" y="494" font-size="13" font-weight="700" fill="#1f3358">Illustrated example — no live learner data</text><g><circle cx="330" cy="236" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="330" y="240.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text></g><circle cx="28" cy="516" r="10" fill="#c2410c"/><text x="28" y="520" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="48" y="520" font-size="13" font-weight="400" fill="#1d2a44">Username</text><g><circle cx="330" cy="300" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="330" y="304.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><circle cx="28" cy="542" r="10" fill="#c2410c"/><text x="28" y="546" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="48" y="546" font-size="13" font-weight="400" fill="#1d2a44">Password</text><g><circle cx="680" cy="236" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="680" y="240.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><circle cx="28" cy="568" r="10" fill="#c2410c"/><text x="28" y="572" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="48" y="572" font-size="13" font-weight="400" fill="#1d2a44">Contact your line manager or Admin Team</text></svg>