<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" font-family="system-ui,Segoe UI,sans-serif" role="img"><title>Staff Portal overview - illustrated example</title><rect width="960" height="602" fill="#f4f7f6"/><rect width="960" height="470" fill="#f4f7f6"/><text x="480" y="50" font-size="20" font-weight="700" fill="#1d2a44" text-anchor="middle">My School Attendance Manager</text><rect x="60" y="130" width="230" height="150" rx="6" fill="#fff" stroke="#d7dfe6"/><text x="175" y="175" font-size="15" font-weight="700" fill="#1d2a44" text-anchor="middle">School Google Sheets</text><text x="175" y="200" font-size="12" font-weight="400" fill="#5d6b7b" text-anchor="middle">Courses, staff assignments</text><text x="175" y="218" font-size="12" font-weight="400" fill="#5d6b7b" text-anchor="middle">Student roster</text><text x="175" y="236" font-size="12" font-weight="400" fill="#5d6b7b" text-anchor="middle">Attendance records, KPI benchmarks</text><path d="M295 205h120" stroke="#458980" stroke-width="3"/><path d="M415 205l-10-7v14z" fill="#458980"/><text x="355" y="190" font-size="11" font-weight="700" fill="#32776f" text-anchor="middle">every 15 min</text><rect x="420" y="130" width="230" height="150" rx="6" fill="#e1efec" stroke="#458980"/><text x="535" y="185" font-size="15" font-weight="700" fill="#1d2a44" text-anchor="middle">Staff Portal</text><text x="535" y="210" font-size="12" font-weight="400" fill="#5d6b7b" text-anchor="middle">Timetable, courses, registers</text><path d="M655 205h60" stroke="#458980" stroke-width="3"/><path d="M715 205l-10-7v14z" fill="#458980"/><rect x="720" y="130" width="190" height="150" rx="6" fill="#fff" stroke="#d7dfe6"/><text x="815" y="185" font-size="15" font-weight="700" fill="#1d2a44" text-anchor="middle">Staff browser</text><text x="815" y="210" font-size="11" font-weight="400" fill="#5d6b7b" text-anchor="middle">Chrome, Edge, Safari, Firefox</text><rect x="0" y="470" width="960" height="132" fill="#fff" stroke="#d7dfe6"/><text x="20" y="494" font-size="13" font-weight="700" fill="#1f3358">Illustrated example — no live learner data</text><g><circle cx="60" cy="130" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="60" y="134.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text></g><circle cx="28" cy="516" r="10" fill="#c2410c"/><text x="28" y="520" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="48" y="520" font-size="13" font-weight="400" fill="#1d2a44">School Google Sheets</text><g><circle cx="300" cy="190" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="300" y="194.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text></g><circle cx="28" cy="542" r="10" fill="#c2410c"/><text x="28" y="546" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="48" y="546" font-size="13" font-weight="400" fill="#1d2a44">Automatic refresh every 15 minutes</text><g><circle cx="720" cy="130" r="12" fill="#c2410c" stroke="#fff" stroke-width="2"/><text x="720" y="134.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text></g><circle cx="28" cy="568" r="10" fill="#c2410c"/><text x="28" y="572" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="48" y="572" font-size="13" font-weight="400" fill="#1d2a44">Any browser, nothing to install</text></svg>