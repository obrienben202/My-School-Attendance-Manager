<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 602" font-family="system-ui,Segoe UI,sans-serif" role="img"><title>Staff roles - illustrated example</title><rect width="960" height="602" fill="#f4f7f6"/><rect width="960" height="470" fill="#f4f7f6"/><text x="480" y="46" font-size="16" font-weight="700" fill="#1d2a44" text-anchor="middle">Role overview (from the original guide table)</text><rect x="60" y="70" width="840" height="62" rx="6" fill="#fff" stroke="#d7dfe6"/><rect x="80" y="92" width="110" height="18" rx="9" fill="#fef3c7" stroke="#fef3c7"/><text x="135" y="105" font-size="10.5" font-weight="600" fill="#92400e" text-anchor="middle">Admin</text><text x="220" y="98" font-size="12" font-weight="600" fill="#1d2a44">Senior leadership, IT administrators</text><text x="220" y="118" font-size="12" font-weight="400" fill="#5d6b7b">Full access</text><rect x="60" y="144" width="840" height="62" rx="6" fill="#fff" stroke="#d7dfe6"/><rect x="80" y="166" width="110" height="18" rx="9" fill="#ede9fe" stroke="#ede9fe"/><text x="135" y="179" font-size="10.5" font-weight="600" fill="#4c1d95" text-anchor="middle">HR</text><text x="220" y="172" font-size="12" font-weight="600" fill="#1d2a44">Human Resources staff</text><text x="220" y="192" font-size="12" font-weight="400" fill="#5d6b7b">Equivalent to Admin</text><rect x="60" y="218" width="840" height="62" rx="6" fill="#fff" stroke="#d7dfe6"/><rect x="80" y="240" width="110" height="18" rx="9" fill="#d1fae5" stroke="#d1fae5"/><text x="135" y="253" font-size="10.5" font-weight="600" fill="#064e3b" text-anchor="middle">Head of Dept</text><text x="220" y="246" font-size="12" font-weight="600" fill="#1d2a44">Heads of Department</text><text x="220" y="266" font-size="12" font-weight="400" fill="#5d6b7b">Department timetable, edit slots</text><rect x="60" y="292" width="840" height="62" rx="6" fill="#fff" stroke="#d7dfe6"/><rect x="80" y="314" width="110" height="18" rx="9" fill="#dbeafe" stroke="#dbeafe"/><text x="135" y