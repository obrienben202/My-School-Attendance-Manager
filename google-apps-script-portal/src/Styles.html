<style>
:root{
  --brand:#458980;--brand-d:#356c65;--brand-l:#e3efed;--brand-ll:#f1f7f6;
  --side:#1c2b33;--side-2:#24363f;--side-fg:#d5e1e4;--side-mute:#8aa0a8;
  --bg:#f4f7f6;--card:#fcfdfd;--ink:#1d2a30;--mute:#5d6f76;--line:#d9e3e2;--line-2:#e9efee;
  --ok:#2f7d4f;--ok-l:#e2f2e8;--bad:#b23b3b;--bad-l:#f8e5e3;--warn:#a5650f;--warn-l:#fbefd9;--info:#2e5f86;--info-l:#e3eef7;
  --r:8px;--sh:0 1px 2px rgba(28,43,51,.06),0 4px 14px rgba(28,43,51,.06);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 var(--font);color:var(--ink);background:var(--bg);min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-d)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--brand);color:#fff;padding:8px 12px;z-index:99}.skip:focus{left:8px}
.muted{color:var(--mute)}.mono{font-family:var(--mono);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* boot / sk */
.boot{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:12px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:#fff;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.mark.lg{width:52px;height:52px;font-size:18px;border-radius:12px}
.sk{background:linear-gradient(90deg,var(--line-2),#f6f9f9,var(--line-2));background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:4px}
.sk-line{height:12px;margin:6px 0}.sk-row{height:34px;margin:4px 0}
@keyframes sh{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;background:var(--side);padding:20px;
  background-image:radial-gradient(circle at 20% 10%,rgba(69,137,128,.28),transparent 45%),radial-gradient(circle at 90% 90%,rgba(69,137,128,.16),transparent 40%)}
.login-card{width:100%;max-width:380px;background:var(--side-2);border:1px solid #334a55;border-radius:14px;padding:30px;color:#eef4f5;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:rise .35s ease}
.login-card h1{margin:12px 0 2px;font-size:20px}.login-card p{margin:0;color:var(--side-mute);font-size:13px}
.aud{display:grid;grid-template-columns:1fr 1fr;background:#1a2930;border-radius:8px;padding:3px;margin:20px 0 14px}
.aud button{border:0;background:none;color:var(--side-mute);padding:8px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px}
.aud button[aria-pressed=true]{background:var(--brand);color:#fff}
.login label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mute);margin:10px 0 4px;font-weight:600}
.login input{width:100%;background:#1a2930;border:1px solid #3a525d;color:#fff;border-radius:7px;padding:10px 11px}
.login input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px rgba(69,137,128,.35)}
.login .msg{margin-top:12px;font-size:12.5px;padding:8px 10px;border-radius:7px;background:rgba(178,59,59,.18);border:1px solid rgba(178,59,59,.5);color:#f3c9c6}
.login .note{margin-top:16px;font-size:12px;color:var(--side-mute)}
.login .btn{width:100%;margin-top:16px;justify-content:center;padding:10px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--brand-ll);border-color:#b8cfcc}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d)}
.btn.dan{color:var(--bad);border-color:#e4c2bf}.btn.dan:hover{background:var(--bad-l)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn.busy::before{content:"";width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* shell */
.shell{display:flex;min-height:100dvh}
.side{width:216px;flex:none;background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column}
.brand{display:flex;gap:9px;align-items:center;padding:16px 14px;border-bottom:1px solid #2d434d}
.brand strong{display:block;font-size:13px}.brand span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-mute);font-weight:600}
.nav{flex:1;overflow:auto;padding:10px}
.nav h2{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--side-mute);margin:14px 8px 6px}
.nav a{display:block;padding:7px 10px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:13px;opacity:.85;transition:background .12s}
.nav a:hover{background:#2b414b;opacity:1}.nav a[aria-current=page]{background:var(--brand);color:#fff;opacity:1;font-weight:600}
.side-foot{border-top:1px solid #2d434d;padding:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;min-height:54px;padding:0 22px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:15px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;color:var(--mute);text-align:right;line-height:1.2}.who b{display:block;color:var(--ink);font-size:12.5px}
.menu-btn{display:none}
.content{padding:20px 22px 40px;animation:rise .25s ease}
.scrim{display:none}
@media(max-width:820px){
  .side{position:fixed;left:0;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}.scrim.open{display:block;position:fixed;inset:0;background:rgba(20,30,35,.45);z-index:25}
  .menu-btn{display:inline-flex}.who{display:none}.top{padding:0 12px}.content{padding:14px 12px 40px}
}
/* learner */
.lhead{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--line)}
.ltabs{display:flex;gap:4px;flex:1;overflow:auto}
.ltabs a{padding:7px 11px;border-radius:6px;text-decoration:none;color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap}
.ltabs a:hover{background:var(--brand-ll);color:var(--ink)}.ltabs a[aria-current=page]{background:var(--brand-l);color:var(--brand-d)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{font-size:14px;margin:0;flex:1}.card-b{padding:16px}
.stack>*+*{margin-top:16px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.count{padding:14px 16px;border-left:3px solid var(--brand)}
.count .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count .l{font-size:12px;color:var(--mute)}
.notice{padding:10px 14px;border-left:3px solid var(--warn);background:var(--warn-l);border-radius:6px;margin:6px 0;font-size:13px}
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.modlink{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:7px;text-decoration:none;color:var(--ink);background:var(--card);transition:border-color .15s,background .15s}
.modlink:hover{border-color:var(--brand);background:var(--brand-ll)}.modlink small{display:block;color:var(--mute);font-size:11.5px}
/* table */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:340px;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--card)}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);background:var(--brand-ll);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--brand-ll)}tbody tr.click:focus{outline:2px solid var(--brand);outline-offset:-2px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:12.5px;color:var(--mute)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--line-2);color:var(--mute)}
.pill.Present{background:var(--ok-l);color:var(--ok)}.pill.Absent{background:var(--bad-l);color:var(--bad)}.pill.Late{background:var(--warn-l);color:var(--warn)}.pill.Authorised{background:var(--info-l);color:var(--info)}
/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px}.fld.wide{grid-column:1/-1}
.fld label{font-size:12px;font-weight:600;color:var(--mute)}.fld label .req{color:var(--bad)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(69,137,128,.18)}
.fld textarea{min-height:80px;resize:vertical}.fld textarea.json{font-family:var(--mono);font-size:12px;min-height:110px}
.fld input[readonly],.fld textarea[readonly]{background:var(--line-2);color:var(--mute)}
.fld .err{color:var(--bad);font-size:12px}.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--bad)}
.fld .hint{font-size:11.5px;color:var(--mute)}
.chk{flex-direction:row;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:14px}
.savestate{font-size:12px;color:var(--mute)}.savestate.ok{color:var(--ok)}
/* states */
.state{padding:34px 20px;text-align:center;color:var(--mute)}
.state h3{color:var(--ink);margin:10px 0 4px;font-size:15px}
.state svg{opacity:.85}
.alert{padding:10px 14px;border-radius:7px;font-size:13px;border:1px solid}
.alert.bad{background:var(--bad-l);border-color:#e7c1bd;color:#7d2626}.alert.warn{background:var(--warn-l);border-color:#ecd2a3;color:#6f4508}.alert.info{background:var(--info-l);border-color:#c3d8ea;color:#234a69}
.conflict{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.conflict pre{margin:0;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;font:12px var(--mono);white-space:pre-wrap;word-break:break-word}
@media(max-width:700px){.conflict{grid-template-columns:1fr}}
/* register */
.reg-row{display:grid;grid-template-columns:minmax(140px,1.3fr) auto minmax(120px,1fr);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line-2)}
.reg-row:hover{background:var(--brand-ll)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:6px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button:last-child{border-right:0}.seg button:hover{background:var(--brand-ll)}
.seg button[aria-pressed=true].Present{background:var(--ok);color:#fff}.seg button[aria-pressed=true].Absent{background:var(--bad);color:#fff}
.seg button[aria-pressed=true].Late{background:var(--warn);color:#fff}.seg button[aria-pressed=true].Authorised{background:var(--info);color:#fff}
.seg button[aria-pressed=true].NotMarked{background:var(--mute);color:#fff}
.reg-row input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
@media(max-width:700px){.reg-row{grid-template-columns:1fr}}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:980px){.split{grid-template-columns:1fr}}
.filelist{list-style:none;margin:0;padding:0}.filelist li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.filelist li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.comment{padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;white-space:pre-wrap}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--side);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--sh);animation:rise .2s ease;max-width:340px;border-left:4px solid var(--brand)}
.toast.bad{border-left-color:#e07a72}
.crumb{font-size:12px;color:var(--mute);margin-bottom:6px}.crumb a{text-decoration:none}
</style>
